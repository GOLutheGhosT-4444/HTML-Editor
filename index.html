<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Visual HTML Editor</title>
    <style>
        :root {
            --bg: #181820;
            --sidebar: #22222d;
            --panel-bg: #2d2d3a;
            --text: #e0e0e0;
            --accent: #00d2d3;
            --accent-hover: #01a3a4;
            --danger: #ff6b6b;
            --border: #111118;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; background-color: var(--bg); color: var(--text); overflow: hidden; }

        /* Layout Structure */
        .sidebar { width: 320px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 2px solid var(--border); transition: margin-left 0.3s ease; z-index: 20; }
        .sidebar.collapsed { margin-left: -320px; }

        .sidebar-toggle-btn { position: absolute; right: -18px; top: 15px; width: 18px; height: 38px; background: var(--accent); color: #111; font-weight: bold; border: none; border-radius: 0 6px 6px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; z-index: 25; }
        .sidebar-toggle-btn:hover { background: var(--accent-hover); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; height: 100vh; }

        .top-editor { flex: 1; display: flex; flex-direction: column; border-bottom: 2px solid var(--border); background: #1e1e1e; transition: all 0.3s; min-height: 0; }
        .main-content.preview-expanded .top-editor { display: none !important; }

        .bottom-preview { flex: 1.2; background: #ffffff; position: relative; display: flex; flex-direction: column; min-height: 0; }
        .main-content.preview-expanded .bottom-preview { flex: 1; height: 100vh; }

        .preview-expand-btn { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; border: none; padding: 4px 16px; font-size: 11px; font-weight: bold; border-radius: 0 0 8px 8px; cursor: pointer; z-index: 30; display: flex; gap: 6px; }
        .preview-expand-btn:hover { padding-bottom: 6px; }

        .tabs { display: flex; background: #16161e; }
        .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; color: #888; cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom: 3px solid var(--accent); background: var(--sidebar); }

        .item-list { padding: 15px; overflow-y: auto; flex: 1; }
        .list-item { background: var(--panel-bg); padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; transition: 0.2s; }
        .list-item:hover { background: #3d3d4e; border-color: var(--accent); }

        .element-editor { display: none; padding: 18px; background: var(--sidebar); border-top: 2px solid var(--border); }
        .element-editor.active { display: flex; flex-direction: column; gap: 10px; animation: slideUp 0.3s; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .input-group input[type="text"] { background: #16161e; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; }
        .input-group input[type="color"] { width: 100%; height: 36px; border: none; border-radius: 4px; cursor: pointer; background: transparent; }

        .save-btn { background: var(--accent); color: #111; font-weight: bold; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 5px; }

        .code-header { background: #16161e; padding: 8px 18px; font-size: 13px; font-weight: bold; color: #bbb; display: flex; justify-content: space-between; }
        #main-code { width: 100%; height: 100%; background: #1e1e1e; color: #9cdcfe; border: none; padding: 16px; font-family: monospace; font-size: 13px; resize: none; outline: none; line-height: 1.5; }
        #preview-frame { width: 100%; height: 100%; border: none; background: #fff; }

        .color-box { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; display: inline-block; }

        /* Right Click Context Menu */
        .context-menu { position: fixed; display: none; background: #22222d; border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 14px; width: 260px; z-index: 1000; flex-direction: column; gap: 10px; }
        .context-menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .context-menu-header span { font-size: 12px; font-weight: bold; color: var(--accent); }
        .context-menu-close { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: bold; }

        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()">◀</button>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('colors', event)">Colours</button>
            <button class="tab-btn" onclick="switchTab('texts', event)">Texts</button>
            <button class="tab-btn" onclick="switchTab('buttons', event)">Buttons</button>
        </div>
        <div class="item-list" id="sidebar-list"></div>

        <div class="element-editor" id="quick-editor">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="editor-title" style="font-size: 13px; font-weight: bold; color: #fff;">Edit Element</span>
                <button onclick="closeEditor()" style="background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer;">✕</button>
            </div>
            <div id="visual-editor-fields"></div>
        </div>
    </div>

    <div class="main-content" id="main-content">
        <div class="top-editor">
            <div class="code-header">
                <span>Master HTML Code</span>
                <span style="font-size: 11px; color: #888;">Live Sync Enabled</span>
            </div>
           <textarea id="main-code" onkeyup="updateLivePreview()">
<div style="background-color: #f4f4f9; padding: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; border-radius: 12px; max-width: 600px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="color: #2c3e50; margin-bottom: 12px; font-size: 24px;">Welcome to Interactive Editor</h2>
    <p style="color: #7f8c8d; margin-bottom: 20px; font-size: 15px;">Right-click any element in the preview below to style it directly!</p>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" placeholder="Enter full name" style="padding: 12px; border: 1px solid #cccccc; border-radius: 6px; flex: 1; outline: none;" />
        <button class="btn" style="background: #6c5ce7; color: #ffffff; padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Submit Now</button>
    </div>

    <div class="popup" style="padding: 16px; border-left: 5px solid #ff7675; background: #ffeaa7; border-radius: 6px;">
        <h4 style="color: #d63031; margin-bottom: 6px;">Important Notice</h4>
        <p style="color: #636e72; font-size: 14px;">Try right-clicking on this text or box to change font, padding or colors!</p>
    </div>
</div>
            </textarea>
        </div>

        <div class="bottom-preview">
            <button class="preview-expand-btn" id="expand-btn" onclick="toggleExpandPreview()">
                <span id="expand-icon">▲</span> <span id="expand-text">Full Preview</span>
            </button>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <div class="context-menu-header">
            <span id="ctx-element-tag">Style Inspector</span>
            <button class="context-menu-close" onclick="closeContextMenu()">✕</button>
        </div>
        <div class="input-group"><label>Text Content</label><input type="text" id="ctx-text" oninput="updateContextTarget()"></div>
        <div class="input-group"><label>Text Color</label><input type="color" id="ctx-color" oninput="updateContextTarget()"></div>
        <div class="input-group"><label>Background</label><input type="color" id="ctx-bg" oninput="updateContextTarget()"></div>
        <div class="input-group"><label>Font Size</label><input type="text" id="ctx-font-size" oninput="updateContextTarget()"></div>
        <div class="input-group"><label>Padding</label><input type="text" id="ctx-padding" oninput="updateContextTarget()"></div>
    </div>

    <script>
        let currentTab = 'colors';
        let activeIframeDoc = null;
        let editableElements = [];
        let currentEditIndex = null;
        let activeColorHex = null;
        let ctxTargetElement = null;

        window.onload = updateLivePreview;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('sidebar-toggle').innerText = document.getElementById('sidebar').classList.contains('collapsed') ? '▶' : '◀';
        }

        function toggleExpandPreview() {
            const main = document.getElementById('main-content');
            main.classList.toggle('preview-expanded');
            document.getElementById('expand-icon').innerText = main.classList.contains('preview-expanded') ? '▼' : '▲';
            document.getElementById('expand-text').innerText = main.classList.contains('preview-expanded') ? 'Restore View' : 'Full Preview';
        }

        function switchTab(tabName, event) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            closeEditor();
            if(activeIframeDoc) clearHighlighters(activeIframeDoc);
            populateSidebar();
        }

        function updateLivePreview() {
            const code = document.getElementById('main-code').value;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;

            iframe.onload = () => {
                activeIframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                injectSmartHighlighter(activeIframeDoc);
                attachRightClick(activeIframeDoc);
                populateSidebar();
            };
        }

        // ==========================================
        // 🔥 MAGIC HIGHLIGHTER & AUTO-REVEAL LOGIC
        // ==========================================
        function injectSmartHighlighter(doc) {
            if(doc.getElementById('smart-editor-styles')) return;
            const style = doc.createElement('style');
            style.id = 'smart-editor-styles';
            style.innerHTML = `
                @keyframes redAntMarch {
                    0% { background-position: 0 0, 100% 100%, 0 100%, 100% 0; }
                    100% { background-position: -20px 0, calc(100% + 20px) 100%, 0 calc(100% - 20px), 100% 20px; }
                }
                .magic-hl-box {
                    position: absolute; pointer-events: none; z-index: 999999;
                    background: transparent;
                    background-image: linear-gradient(90deg, red 50%, transparent 50%), linear-gradient(90deg, red 50%, transparent 50%), linear-gradient(0deg, red 50%, transparent 50%), linear-gradient(0deg, red 50%, transparent 50%);
                    background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
                    background-size: 12px 2px, 12px 2px, 2px 12px, 2px 12px;
                    animation: redAntMarch 0.7s linear infinite;
                    border-radius: 4px;
                }
                .force-visible { display: block !important; opacity: 1 !important; visibility: visible !important; }
            `;
            doc.head.appendChild(style);
        }

        function clearHighlighters(doc) {
            doc.querySelectorAll('.magic-hl-box').forEach(el => el.remove());
        }

        function highlightAndCenterElement(el, doc) {
            clearHighlighters(doc);

            // Auto-Reveal Hidden Parents (Popups)
            let curr = el;
            while(curr && curr !== doc.body) {
                const style = window.getComputedStyle(curr);
                if(style.display === 'none' || style.opacity === '0' || style.visibility === 'hidden') {
                    curr.classList.add('force-visible');
                }
                curr = curr.parentElement;
            }

            // Smooth Scroll Center
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Create Animated Red Border
            setTimeout(() => {
                const rect = el.getBoundingClientRect();
                const hl = doc.createElement('div');
                hl.className = 'magic-hl-box';
                const sTop = doc.documentElement.scrollTop || doc.body.scrollTop;
                const sLeft = doc.documentElement.scrollLeft || doc.body.scrollLeft;

                hl.style.top = (rect.top + sTop - 6) + 'px';
                hl.style.left = (rect.left + sLeft - 6) + 'px';
                hl.style.width = (rect.width + 12) + 'px';
                hl.style.height = (rect.height + 12) + 'px';
                doc.body.appendChild(hl);
            }, 50);
        }

        // ==========================================
        // SIDEBAR & EDIT LOGIC
        // ==========================================
        function populateSidebar() {
            const list = document.getElementById('sidebar-list');
            list.innerHTML = ''; editableElements = [];

            if (currentTab === 'colors') {
                const colors = [...new Set(document.getElementById('main-code').value.match(/#(?:[0-9a-fA-F]{3}){1,2}/g) || [])];
                colors.forEach(col => {
                    list.innerHTML += `<div class="list-item" onclick="openColorEditor('${col}')"><span>${col}</span><div class="color-box" style="background-color: ${col}"></div></div>`;
                });
            } else {
                let els = activeIframeDoc.querySelectorAll(currentTab === 'buttons' ? 'button, .btn' : 'h1, h2, h3, p, span');
                els.forEach((el, i) => {
                    editableElements.push(el);
                    const tag = el.tagName.toLowerCase();
                    const txt = el.innerText.trim().substring(0, 15) || 'Empty';
                    list.innerHTML += `<div class="list-item" onclick="openElementEditor(${i})">
                        <div><span style="color:var(--accent)"><b>&lt;${tag}&gt;</b></span> <span style="color:#aaa;font-size:11px">"${txt}..."</span></div>✏️</div>`;
                });
            }
        }

        function closeEditor() {
            document.getElementById('quick-editor').classList.remove('active');
            if(activeIframeDoc) clearHighlighters(activeIframeDoc);
        }

        function openElementEditor(idx) {
            currentEditIndex = idx;
            const el = editableElements[idx];
            highlightAndCenterElement(el, activeIframeDoc);

            const bg = el.style.backgroundColor || window.getComputedStyle(el).backgroundColor;
            const color = el.style.color || window.getComputedStyle(el).color;

            document.getElementById('visual-editor-fields').innerHTML = `
                <div class="input-group"><label>Text</label><input type="text" value="${el.innerText}" oninput="applyLiveDOMEdit('text', this.value)"></div>
                ${currentTab === 'buttons' ? `<div class="input-group"><label>Background</label><input type="color" value="${rgb2hex(bg)}" oninput="applyLiveDOMEdit('bg', this.value)"></div>` : ''}
                <div class="input-group"><label>Text Color</label><input type="color" value="${rgb2hex(color)}" oninput="applyLiveDOMEdit('color', this.value)"></div>
            `;
            document.getElementById('quick-editor').classList.add('active');
        }

        function openColorEditor(col) {
            activeColorHex = col;
            document.getElementById('visual-editor-fields').innerHTML = `<div class="input-group"><label>Replace ${col}</label><input type="color" value="${col}" oninput="applyGlobalColor(this.value)"></div>`;
            document.getElementById('quick-editor').classList.add('active');
        }

        function applyLiveDOMEdit(type, val) {
            const el = editableElements[currentEditIndex];
            if(type === 'text') el.innerText = val;
            if(type === 'bg') el.style.backgroundColor = val;
            if(type === 'color') el.style.color = val;

            highlightAndCenterElement(el, activeIframeDoc); // Adjust border size
            syncToMainCode();
        }

        function applyGlobalColor(newCol) {
            let code = document.getElementById('main-code').value;
            document.getElementById('main-code').value = code.replace(new RegExp(activeColorHex, 'gi'), newCol);
            updateLivePreview();
            activeColorHex = newCol; // update reference
        }

        function syncToMainCode() {
            // Temporarily hide our magic classes before saving code!
            const hlBoxes = activeIframeDoc.querySelectorAll('.magic-hl-box');
            const forced = activeIframeDoc.querySelectorAll('.force-visible');

            hlBoxes.forEach(el => el.style.display = 'none');
            forced.forEach(el => el.classList.remove('force-visible'));

            document.getElementById('main-code').value = activeIframeDoc.body.innerHTML.trim();

            // Put them back so editing remains smooth
            hlBoxes.forEach(el => el.style.display = 'block');
            forced.forEach(el => el.classList.add('force-visible'));
        }

        function rgb2hex(rgb) {
            let m = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            return m ? "#" + ("0" + parseInt(m[1]).toString(16)).slice(-2) + ("0" + parseInt(m[2]).toString(16)).slice(-2) + ("0" + parseInt(m[3]).toString(16)).slice(-2) : rgb;
        }

        // ==========================================
        // RIGHT-CLICK CONTEXT MENU
        // ==========================================
        function attachRightClick(doc) {
            doc.addEventListener('contextmenu', e => {
                e.preventDefault();
                if(!e.target || e.target === doc.body) return;
                ctxTargetElement = e.target;

                highlightAndCenterElement(ctxTargetElement, doc); // Highlight clicked element

                let x = document.getElementById('preview-frame').getBoundingClientRect().left + e.clientX;
                let y = document.getElementById('preview-frame').getBoundingClientRect().top + e.clientY;

                const menu = document.getElementById('context-menu');
                document.getElementById('ctx-text').value = ctxTargetElement.innerText;
                document.getElementById('ctx-color').value = rgb2hex(window.getComputedStyle(ctxTargetElement).color);
                document.getElementById('ctx-bg').value = rgb2hex(window.getComputedStyle(ctxTargetElement).backgroundColor);
                document.getElementById('ctx-font-size').value = window.getComputedStyle(ctxTargetElement).fontSize;

                menu.style.left = Math.min(x, window.innerWidth - 270) + 'px';
                menu.style.top = Math.min(y, window.innerHeight - 350) + 'px';
                menu.style.display = 'flex';
            });
            doc.addEventListener('click', () => { document.getElementById('context-menu').style.display = 'none'; clearHighlighters(doc); });
        }

        function closeContextMenu() { document.getElementById('context-menu').style.display = 'none'; }

        function updateContextTarget() {
            if(!ctxTargetElement) return;
            ctxTargetElement.innerText = document.getElementById('ctx-text').value;
            ctxTargetElement.style.color = document.getElementById('ctx-color').value;
            ctxTargetElement.style.backgroundColor = document.getElementById('ctx-bg').value;
            ctxTargetElement.style.fontSize = document.getElementById('ctx-font-size').value;
            ctxTargetElement.style.padding = document.getElementById('ctx-padding').value;

            highlightAndCenterElement(ctxTargetElement, activeIframeDoc);
            syncToMainCode();
        }
    </script>
</body>
</html>
